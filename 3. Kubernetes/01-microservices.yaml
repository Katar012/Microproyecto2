---
# -------------------------------------------------------
# USERS SERVICE
# -------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-deployment
  namespace: microapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: users-service
  template:
    metadata:
      labels:
        app: users-service
    spec:
      containers:
      - name: users-service
        image: jcueror/microservices:users
        imagePullPolicy: Always
        ports:
        - containerPort: 5002
        env:
        - name: MYSQL_HOST
          value: "192.168.100.3"  # Replace with your MySQL server IP or Service name
        - name: MYSQL_USER
          value: "app"
        - name: MYSQL_PASSWORD
          value: "app_password"
        - name: MYSQL_DB
          value: "users_db"
        - name: SECRET_KEY
          value: "secret123"
---
apiVersion: v1
kind: Service
metadata:
  name: users-svc
  namespace: microapp
spec:
  type: ClusterIP
  selector:
    app: users-service
  ports:
  - port: 5002
    targetPort: 5002

---
